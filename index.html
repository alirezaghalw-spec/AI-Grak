<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>هوش پرو | فروشگاه</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a3a4a;--bg:#fff;--pink:#ffc8dd;--blue:#bde0fe;--mint:#b9fbc0;--yellow:#fdffb6;--lav:#cdb4db;--red:#ffb3c6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.px{font-family:'Press Start 2P',monospace;font-size:11px}
header{display:flex;align-items:center;gap:4px;padding:8px;border-bottom:4px solid var(--ink)}
header h1{margin:0;font-size:15px;flex:1;display:flex;align-items:center;gap:6px}
.logo{width:24px;height:24px;image-rendering:pixelated}
.btn{font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;border:3px solid var(--ink);padding:7px 10px;background:var(--blue);box-shadow:4px 4px 0 var(--ink);position:relative;transition:all 0.1s;white-space:nowrap;}
.btn:active{top:3px;left:3px;box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.yellow{background:var(--yellow)}.btn.lav{background:var(--lav)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default;top:0;left:0;box-shadow:4px 4px 0 var(--ink)}
#modelBtn{max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;font-size:10px;padding:7px 4px;}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{max-width:92%;padding:10px 12px;border:3px solid var(--ink);word-break:break-word;line-height:1.9;box-shadow:4px 4px 0 var(--ink);position:relative;}
.msg.user{align-self:flex-start;background:var(--mint);white-space:pre-wrap}
.msg.bot{align-self:flex-end;background:var(--yellow)}
.msg.err{align-self:center;background:var(--pink);white-space:pre-wrap}
.md p{margin:6px 0}
.md code:not(pre code){font-family:monospace;font-size:13px;direction:ltr;background:#fff;border:2px solid var(--ink);padding:0 4px}
.md pre{border:3px solid var(--ink);background:#1e1e1e;direction:ltr;text-align:left;margin:8px 0;position:relative;border-radius:4px;}
.md pre code{font-family:monospace;font-size:13px;padding:10px;display:block;overflow-x:auto;background:transparent;}
.copy-code{position:absolute;top:4px;right:4px;background:var(--mint);border:2px solid var(--ink);cursor:pointer;padding:2px 6px;font-family:inherit;font-size:11px;z-index:2;}
.usage-info{font-size:11px;margin-top:6px;color:#666;text-align:left;direction:ltr;border-top:1px dashed #ccc;padding-top:4px}
.attach-preview{display:none;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:2px dashed var(--ink);background:#fafafa}
.attach-item{position:relative;border:2px solid var(--ink);padding:4px;background:#fff;font-size:12px;max-width:110px}
.attach-item img{max-width:100px;max-height:70px;display:block}
.attach-item .rm{position:absolute;top:-8px;left:-8px;background:var(--pink);border:2px solid var(--ink);width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
form{display:flex;gap:4px;padding:10px;border-top:4px solid var(--ink);align-items:flex-end}
textarea{flex:1;resize:none;font-family:inherit;font-size:15px;color:var(--ink);border:3px solid var(--ink);padding:8px;background:#fff;max-height:130px;outline:none}
.overlay{position:fixed;inset:0;background:rgba(58,58,74,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.on{display:flex}
.card{background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);width:100%;max-width:550px;max-height:85vh;display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;}
.card h2{margin:0;font-size:16px;border-bottom:3px solid var(--ink);padding-bottom:8px;}
.card input,.card textarea{font-family:inherit;font-size:14px;border:3px solid var(--ink);padding:8px;outline:none;width:100%}
.card input{direction:ltr}
#modelList,#convList{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.mitem{text-align:left;font-family:monospace;font-size:12px;padding:8px;cursor:pointer;border:3px solid var(--ink);background:#fff;word-break:break-all}
.mitem.sel{background:var(--pink)}
.citem{display:flex;gap:6px}
.citem .ct{flex:1;text-align:right;font-size:13px;padding:8px;cursor:pointer;border:3px solid var(--ink);background:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ct.sel{background:var(--pink)}
.citem .cd{border:3px solid var(--ink);background:var(--pink);cursor:pointer;padding:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.note{font-size:12px;opacity:.8;line-height:1.8}
.slider-container{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
.slider-container input[type=range]{accent-color:var(--ink);}
#jsErr{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#ffc8dd;border-bottom:4px solid #3a3a4a;padding:8px;font-family:monospace;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
/* استایل فروشگاه */
.store-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.store-item{border:3px solid var(--ink);padding:10px;background:#fdfdfd;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;gap:6px;}
.store-item.installed{background:var(--mint);}
.store-item h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.store-item p{margin:0;font-size:12px;line-height:1.6;}
.store-btn{padding:4px 8px;font-size:12px;border:2px solid var(--ink);cursor:pointer;font-family:inherit;font-weight:bold;}
.store-btn.install{background:var(--blue);}
.store-btn.uninstall{background:var(--red);}
</style>
</head>
<body>
<div id="jsErr"></div>

<header>
  <h1><svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect width="8" height="8" fill="#ffffff"/><rect x="1" y="1" width="6" height="5" fill="#cdb4db"/><rect x="2" y="2" width="1" height="1" fill="#3a3a4a"/><rect x="5" y="2" width="1" height="1" fill="#3a3a4a"/><rect x="2" y="4" width="4" height="1" fill="#ffc8dd"/><rect x="3" y="0" width="2" height="1" fill="#3a3a4a"/><rect x="1" y="6" width="6" height="1" fill="#3a3a4a"/></svg>هوش</h1>
  <button class="btn mint" id="convBtn" type="button">☰</button>
  <button class="btn lav px" id="modelBtn" type="button">MODEL</button>
  <button class="btn blue" id="storeBtn" type="button" title="فروشگاه">🛒</button>
  <button class="btn yellow" id="setBtn" type="button">⚙</button>
</header>

<div id="chat"></div>
<div id="attachPreview" class="attach-preview"></div>

<form id="form">
  <button class="btn mint" id="attachBtn" type="button">📎</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>
  <button class="btn pink" id="sendBtn" type="submit">ارسال</button>
  <button class="btn red" id="stopBtn" type="button" style="display:none;">توقف</button>
</form>

<!-- مودال‌ها -->
<div class="overlay" id="convOv"><div class="card"><h2>گفتگوها</h2><div id="convList"></div><div class="row"><button class="btn mint" id="convNew" type="button">+ گفتگوی تازه</button><button class="btn" id="convClose" type="button">بستن</button></div></div></div>
<div class="overlay" id="modelOv"><div class="card"><h2>انتخاب مدل (OpenRouter)</h2><div id="modelList"></div><div class="row"><button class="btn" id="modelClose" type="button">بستن</button></div></div></div>

<!-- مودال فروشگاه -->
<div class="overlay" id="storeOv">
  <div class="card">
    <h2>🛒 فروشگاه مهارت‌ها و ابزارها</h2>
    <div class="note">ابزارهای مورد نیاز خود را نصب کنید تا هوش مصنوعی به آن‌ها مجهز شود.</div>
    <div class="store-grid" id="storeGrid"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="storeClose" type="button">بستن</button>
    </div>
  </div>
</div>

<!-- تنظیمات -->
<div class="overlay" id="setOv">
  <div class="card">
    <h2>تنظیمات</h2>
    <div class="note">کلید API:</div>
    <input id="keyInput" type="password" placeholder="sk-or-v1-..." autocomplete="off">
    <div class="note">پرامپت سیستم پایه:</div>
    <textarea id="sysPromptInput" rows="2" placeholder="مثلاً: تو یک دستیار مفید هستی..."></textarea>
    <div class="slider-container">
      <div class="note">خلاقیت (Temperature): <span id="tempVal">0.7</span></div>
      <input id="tempInput" type="range" min="0" max="2" step="0.1" value="0.7">
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn mint" id="keySave" type="button">ذخیره</button>
      <button class="btn pink" id="clearChat" type="button">پاک‌کردن این گفتگو</button>
      <button class="btn" id="setClose" type="button">بستن</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, src, line) { var b = document.getElementById('jsErr'); if (b) { b.style.display = 'block'; b.textContent += 'JS error: ' + msg + '\n'; } };
const $ = function(id) { return document.getElementById(id); };
const chat = $('chat'), input = $('input'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');

marked.setOptions({ breaks: true, highlight: function(code, lang) { const l = hljs.getLanguage(lang) ? lang : 'plaintext'; return hljs.highlight(code, { language: l }).value; } });

let abortController = null;
let attachments = [];
let convs = JSON.parse(localStorage.getItem('hoosh_convs') || '[]');
let installedTools = JSON.parse(localStorage.getItem('hoosh_tools') || '[]'); // ابزارهای نصب شده
let cur = null;
let busy = false;

function saveConvs() { localStorage.setItem('hoosh_convs', JSON.stringify(convs)); }
function saveTools() { localStorage.setItem('hoosh_tools', JSON.stringify(installedTools)); }
function newConv() { cur = { id: Date.now().toString(36), title: 'گفتگوی جدید', messages: [], ts: Date.now() }; }
function commit() { if (convs.indexOf(cur) === -1) convs.unshift(cur); cur.ts = Date.now(); convs.sort((a, b) => b.ts - a.ts); convs = convs.slice(0, 40); saveConvs(); localStorage.setItem('hoosh_cur', cur.id); }

function getKey() { return localStorage.getItem('hoosh_key') || ''; }
function getModel() { return localStorage.getItem('hoosh_model') || 'openai/gpt-4o'; }
function getSysPrompt() { return localStorage.getItem('hoosh_sys') || ''; }
function getTemp() { return parseFloat(localStorage.getItem('hoosh_temp')) || 0.7; }
function updateUI() { $('modelBtn').textContent = getModel().split('/')[1] || getModel(); }

// لیست ابزارهای فروشگاه
const STORE_ITEMS = [
  { id: 'python_expert', title: '🐍 متخصص پایتون', desc: 'به هوش مصنوعی یاد می‌دهد کدهای پایتون را استاندارد و حرفه‌ای بنویسد.' },
  { id: 'js_expert', title: '🌐 متخصص فرانت‌اند', desc: 'تولید کدهای HTML، CSS و جاوااسکریپت برای ساخت وب‌سایت.' },
  { id: 'image_designer', title: '🎨 طراح تصویر و SVG', desc: 'تبدیل توضیحات شما به کدهای گرافیکی (SVG) و طراحی رابط کاربری.' },
  { id: 'code_interpreter', title: '⚙️ اجراکننده کد (Code Interpreter)', desc: 'کدهای پایتون تولید شده را در سرور اجرا می‌کند و خروجی واقعی را به شما می‌دهد.' },
  { id: 'web_search', title: '🔍 جستجوی وب زنده', desc: 'به هوش مصنوعی اجازه می‌دهد برای پاسخ به سوالات، در اینترنت جستجو کند (اخبار روز، قیمت و...).' }
];

function renderStore() {
  let grid = $('storeGrid'); grid.innerHTML = '';
  STORE_ITEMS.forEach(item => {
    let isInstalled = installedTools.includes(item.id);
    let div = document.createElement('div');
    div.className = 'store-item' + (isInstalled ? ' installed' : '');
    div.innerHTML = `
      <h3>${item.title} <button class="store-btn ${isInstalled ? 'uninstall' : 'install'}" data-id="${item.id}">${isInstalled ? 'حذف' : 'نصب'}</button></h3>
      <p>${item.desc}</p>
    `;
    grid.appendChild(div);
  });
  
  grid.querySelectorAll('button').forEach(btn => {
    btn.onclick = (e) => {
      let id = e.target.getAttribute('data-id');
      if (installedTools.includes(id)) {
        installedTools = installedTools.filter(t => t !== id);
      } else {
        installedTools.push(id);
      }
      saveTools(); renderStore();
    };
  });
}

$('storeBtn').onclick = () => { renderStore(); $('storeOv').classList.add('on'); };
$('storeClose').onclick = () => $('storeOv').classList.remove('on');

// بقیه کدهای مربوط به چت (بدون تغییر)
$('attachBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => {
  for (let f of e.target.files) {
    if (f.size > 3000000) { alert('حجم فایل زیاد است: ' + f.name); continue; }
    if (attachments.length >= 3) { alert('حداکثر ۳ فایل'); break; }
    let reader = new FileReader();
    reader.onload = () => { attachments.push({ name: f.name, type: f.type, dataUrl: reader.result }); renderAttachments(); };
    reader.readAsDataURL(f);
  }
  e.target.value = '';
};

function renderAttachments() {
  let box = $('attachPreview');
  if (!attachments.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex'; box.innerHTML = '';
  attachments.forEach((a, i) => {
    let div = document.createElement('div'); div.className = 'attach-item';
    if (a.type.startsWith('image/')) { let img = document.createElement('img'); img.src = a.dataUrl; div.appendChild(img); }
    let rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×';
    rm.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    div.appendChild(rm); box.appendChild(div);
  });
}

function buildMessageContent(text) {
  if (attachments.length === 0) return text;
  let parts = [{ type: "text", text: text || "این تصاویر را بررسی کن." }];
  attachments.forEach(a => { if (a.type.startsWith('image/')) parts.push({ type: "image_url", image_url: { url: a.dataUrl } }); });
  return parts;
}

function addMsg(content, role) {
  let e = $('empty'); if (e) e.remove();
  let d = document.createElement('div'); d.className = 'msg ' + role;
  if (Array.isArray(content)) {
    let textPart = content.find(p => p.type === 'text')?.text || '';
    let imgParts = content.filter(p => p.type === 'image_url');
    let textDiv = document.createElement('div'); textDiv.style.whiteSpace = 'pre-wrap'; textDiv.textContent = textPart;
    d.appendChild(textDiv);
    imgParts.forEach(img => { let i = document.createElement('img'); i.src = img.image_url.url; i.style.maxWidth = '150px'; i.style.border = '2px solid var(--ink)'; i.style.marginTop = '8px'; d.appendChild(i); });
  } else if (role === 'bot') {
    d.innerHTML = marked.parse(content || '...');
    d.querySelectorAll('pre code').forEach((block) => {
      let btn = document.createElement('button'); btn.className = 'copy-code'; btn.textContent = 'کپی';
      btn.onclick = () => { navigator.clipboard.writeText(block.innerText); btn.textContent = '✓'; setTimeout(()=>btn.textContent='کپی', 1500); };
      block.parentElement.appendChild(btn);
    });
  } else { d.textContent = content; }
  chat.appendChild(d); scrollDown(); return d;
}

function scrollDown() { if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 150) chat.scrollTop = chat.scrollHeight; }

async function send() {
  let text = input.value.trim();
  if ((!text && !attachments.length) || busy) return;
  if (!getKey()) { alert('ابتدا در تنظیمات ⚙ کلید API را وارد کنید'); return; }
  if (!cur) newConv();

  busy = true; sendBtn.style.display = 'none'; stopBtn.style.display = 'block';
  abortController = new AbortController();

  let contentPayload = buildMessageContent(text);
  input.value = ''; input.style.height = 'auto';
  attachments = []; renderAttachments();

  cur.messages.push({ role: 'user', content: contentPayload });
  if (cur.messages.length === 1) cur.title = (text || 'تصویر').slice(0, 40);
  commit();
  
  addMsg(contentPayload, 'user');
  let botEl = addMsg('', 'bot');
  let currentText = '';
  let usageData = null;

  try {
    let res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': getKey() },
      body: JSON.stringify({
        messages: cur.messages.map(m => ({ role: m.role, content: m.content })),
        model: getModel(),
        system_prompt: getSysPrompt(),
        temperature: getTemp(),
        active_tools: installedTools, // ارسال ابزارهای نصب شده به سرور
        stream: true
      }),
      signal: abortController.signal
    });

    if (!res.ok) throw new Error(await res.text());

    let reader = res.body.getReader();
    let dec = new TextDecoder();
    let buf = '';

    while (true) {
      let { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
      let parts = buf.split('\n\n');
      buf = parts.pop();

      for (let part of parts) {
        if (!part.startsWith('data: ')) continue;
        let data = JSON.parse(part.slice(6));
        
        if (data.type === 'delta' && data.text) {
          currentText += data.text;
          botEl.innerHTML = marked.parse(currentText);
          botEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
          scrollDown();
        } else if (data.type === 'usage') {
          usageData = data.usage;
        } else if (data.type === 'error') {
          throw new Error(data.message);
        }
      }
    }

    if (usageData) {
      let u = document.createElement('div'); u.className = 'usage-info';
      u.textContent = `Tokens: ${usageData.total_tokens} | Cost: $${(usageData.total_cost || 0).toFixed(5)}`;
      botEl.appendChild(u);
    }
    
    botEl.querySelectorAll('pre code').forEach((block) => {
      let btn = document.createElement('button'); btn.className = 'copy-code'; btn.textContent = 'کپی';
      btn.onclick = () => { navigator.clipboard.writeText(block.innerText); btn.textContent = '✓'; };
      block.parentElement.appendChild(btn);
    });

    cur.messages.push({ role: 'assistant', content: currentText });
    commit();

  } catch (e) {
    if (e.name === 'AbortError') { botEl.innerHTML += '<div class="note" style="color:red">(متوقف شد)</div>'; }
    else { botEl.className = 'msg err'; botEl.textContent = 'خطا: ' + e.message; }
  } finally {
    busy = false; sendBtn.style.display = 'block'; stopBtn.style.display = 'none'; abortController = null;
  }
}

$('form').onsubmit = (e) => { e.preventDefault(); send(); };
$('stopBtn').onclick = () => { if (abortController) abortController.abort(); };
input.oninput = function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 130) + 'px'; };
input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

$('setBtn').onclick = () => { $('keyInput').value = getKey(); $('sysPromptInput').value = getSysPrompt(); $('tempInput').value = getTemp(); $('tempVal').textContent = getTemp(); $('setOv').classList.add('on'); };
$('setClose').onclick = () => $('setOv').classList.remove('on');
$('tempInput').oninput = function() { $('tempVal').textContent = this.value; };
$('keySave').onclick = () => { localStorage.setItem('hoosh_key', $('keyInput').value.trim()); localStorage.setItem('hoosh_sys', $('sysPromptInput').value.trim()); localStorage.setItem('hoosh_temp', $('tempInput').value); $('setOv').classList.remove('on'); };

const MODELS = [
  { id: 'openai/gpt-4o', name: 'GPT-4o (Vision)' }, { id: 'anthropic/claude-3.5-sonnet', name: 'Claude 3.5' },
{ id: 'x-ai/grok-beta', name: 'Grok Beta' }, { id: 'google/gemini-flash-1.5', name: 'Gemini Flash' }, { id: 'openrouter/auto', name: 'Auto' }
];
$('modelBtn').onclick = () => {
  let list = $('modelList'); list.innerHTML = '';
  MODELS.forEach(m => {
    let b = document.createElement('button'); b.className = 'mitem' + (m.id === getModel() ? ' sel' : ''); b.textContent = m.id;
    b.onclick = () => { localStorage.setItem('hoosh_model', m.id); updateUI(); $('modelOv').classList.remove('on'); };
    list.appendChild(b);
  });
  $('modelOv').classList.add('on');
};
$('modelClose').onclick = () => $('modelOv').classList.remove('on');

$('convBtn').onclick = () => {
  let list = $('convList'); list.innerHTML = '';
  convs.forEach(c => {
    let row = document.createElement('div'); row.className = 'citem';
    let b = document.createElement('button'); b.className = 'ct' + (cur && cur.id === c.id ? ' sel' : ''); b.textContent = c.title;
    b.onclick = () => { loadConv(c.id); $('convOv').classList.remove('on'); };
    let d = document.createElement('button'); d.className = 'cd'; d.textContent = '×';
    d.onclick = (e) => { e.stopPropagation(); convs = convs.filter(x => x.id !== c.id); saveConvs(); if (cur && cur.id === c.id) { newConv(); chat.innerHTML=''; } $('convBtn').click(); };
    row.appendChild(b); row.appendChild(d); list.appendChild(row);
  });
  $('convOv').classList.add('on');
};
$('convClose').onclick = () => $('convOv').classList.remove('on');
$('convNew').onclick = () => { newConv(); chat.innerHTML = ''; $('convOv').classList.remove('on'); };

function loadConv(id) { cur = convs.find(c => c.id === id) || null; if (!cur) return newConv(); chat.innerHTML = ''; cur.messages.forEach(m => addMsg(m.content, m.role)); }

updateUI();
(function() { let id = localStorage.getItem('hoosh_cur'); if (id) loadConv(id); else newConv(); })();
</script>
</body>
</html>
