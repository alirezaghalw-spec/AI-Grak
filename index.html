<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>هوش پرو | دستیار همه‌کاره</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a3a4a;--bg:#fff;--pink:#ffc8dd;--blue:#bde0fe;--mint:#b9fbc0;--yellow:#fdffb6;--lav:#cdb4db;--red:#ffb3c6;--dark-bg:#1e1e24;--dark-ink:#e0e0e0}
body.dark-mode { --bg:var(--dark-bg); --ink:var(--dark-ink); }
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;max-width:760px;margin:0 auto;transition:background 0.3s,color 0.3s;}
header{display:flex;align-items:center;gap:4px;padding:8px;border-bottom:4px solid var(--ink);flex-wrap:wrap;}
header h1{margin:0;font-size:15px;flex:1;display:flex;align-items:center;gap:6px}
.logo{width:24px;height:24px;image-rendering:pixelated}
.btn{font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;border:3px solid var(--ink);padding:7px 10px;background:var(--blue);box-shadow:4px 4px 0 var(--ink);position:relative;transition:all 0.1s;white-space:nowrap;}
body.dark-mode .btn {background:var(--ink); color:var(--bg); border-color:var(--bg); box-shadow:4px 4px 0 var(--bg);}
.btn:active{top:3px;left:3px;box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.yellow{background:var(--yellow)}.btn.lav{background:var(--lav)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default;top:0;left:0;box-shadow:4px 4px 0 var(--ink)}
.btn.active-compare { background: var(--red); color: #fff; border-color: var(--ink); }
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{max-width:92%;padding:10px 12px;border:3px solid var(--ink);word-break:break-word;line-height:1.9;box-shadow:4px 4px 0 var(--ink);position:relative;background:var(--bg);}
.msg.user{align-self:flex-start;background:var(--mint);color:#3a3a4a}
.msg.bot{align-self:flex-end;background:var(--yellow);color:#3a3a4a}
.msg.err{align-self:center;background:var(--pink);color:#3a3a4a;white-space:pre-wrap}
.md p{margin:6px 0}
.md code:not(pre code){font-family:monospace;font-size:13px;direction:ltr;background:#fff;border:2px solid #3a3a4a;padding:0 4px;color:#3a3a4a;}
.md pre{border:3px solid #3a3a4a;background:#1e1e1e;direction:ltr;text-align:left;margin:8px 0;position:relative;}
.md pre code{font-family:monospace;font-size:13px;padding:10px;display:block;overflow-x:auto;}
.md img{max-width:100%;border:3px solid #3a3a4a;margin-top:8px;border-radius:4px;}
details.reasoning {border:2px dashed #888; padding:6px; margin-bottom:8px; font-size:12px; opacity:0.8;}
details.reasoning summary {cursor:pointer; font-weight:bold; color:var(--ink);}
body.dark-mode details.reasoning summary {color:var(--dark-ink);}
.copy-code{position:absolute;top:4px;right:4px;background:var(--mint);color:#3a3a4a;border:2px solid #3a3a4a;cursor:pointer;padding:2px 6px;font-family:inherit;font-size:11px;}
.run-code{position:absolute;top:4px;right:60px;background:var(--yellow);color:#3a3a4a;border:2px solid #3a3a4a;cursor:pointer;padding:2px 6px;font-family:inherit;font-size:11px;}
.preview-box{margin-top:10px;width:100%;height:250px;border:3px solid #3a3a4a;background:#fff;display:none;}
.usage-info{font-size:11px;margin-top:6px;color:#666;text-align:left;direction:ltr;border-top:1px dashed #ccc;padding-top:4px}
body.dark-mode .usage-info {color:#aaa; border-color:#555;}
.attach-preview{display:none;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:2px dashed var(--ink);background:transparent;}
.attach-item{position:relative;border:2px solid var(--ink);padding:4px;background:#fff;font-size:12px;max-width:110px;color:#3a3a4a;}
.attach-item img{max-width:100px;max-height:70px;display:block}
.attach-item .rm{position:absolute;top:-8px;left:-8px;background:var(--pink);border:2px solid #3a3a4a;color:#3a3a4a;width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
form{display:flex;gap:4px;padding:10px;border-top:4px solid var(--ink);align-items:flex-end}
textarea{flex:1;resize:none;font-family:inherit;font-size:15px;color:var(--ink);border:3px solid var(--ink);padding:8px;background:transparent;max-height:130px;outline:none}
.overlay{position:fixed;inset:0;background:rgba(58,58,74,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.on{display:flex}
.card{background:var(--bg);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);width:100%;max-width:550px;max-height:85vh;display:flex;flex-direction:column;padding:12px;gap:10px;overflow-y:auto;}
.card h2{margin:0;font-size:16px;border-bottom:3px solid var(--ink);padding-bottom:8px;}
.card input,.card textarea{font-family:inherit;font-size:14px;border:3px solid var(--ink);padding:8px;outline:none;width:100%;background:transparent;color:var(--ink);}
.card input{direction:ltr}
#modelList,#convList,#promptList{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:100px;}
.mitem,.pitem{text-align:left;font-family:monospace;font-size:12px;padding:8px;cursor:pointer;border:3px solid var(--ink);background:transparent;word-break:break-all;color:var(--ink);}
.mitem.sel{background:var(--pink);color:#3a3a4a;}
.citem{display:flex;gap:6px}
.citem .ct{flex:1;text-align:right;font-size:13px;padding:8px;cursor:pointer;border:3px solid var(--ink);background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.citem .ct.sel{background:var(--pink);color:#3a3a4a;}
.citem .cd{border:3px solid var(--ink);background:var(--pink);color:#3a3a4a;cursor:pointer;padding:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.note{font-size:12px;opacity:.8;line-height:1.8}
.store-tabs{display:flex;gap:6px;margin-bottom:10px;}
.store-tab{flex:1;padding:6px;font-size:13px;border:3px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink);font-family:inherit;font-weight:bold;text-align:center;}
.store-tab.active{background:var(--lav);color:#3a3a4a;}
.store-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.store-item{border:3px solid var(--ink);padding:10px;background:transparent;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;gap:6px;}
.store-item.installed{background:var(--mint);color:#3a3a4a;}
.store-item h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.store-item p{margin:0;font-size:12px;line-height:1.6;}
.store-btn{padding:4px 8px;font-size:12px;border:2px solid #3a3a4a;cursor:pointer;font-family:inherit;font-weight:bold;color:#3a3a4a;}
.store-btn.install{background:var(--blue);}
.store-btn.uninstall{background:var(--red);}
#jsErr{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#ffc8dd;color:#3a3a4a;border-bottom:4px solid #3a3a4a;padding:8px;font-family:monospace;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
.quick-replies { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.quick-reply { padding: 4px 8px; border: 2px solid #3a3a4a; background: #fff; font-size: 11px; border-radius: 4px; cursor: pointer; color: #3a3a4a; }
.quick-reply:hover { background: var(--mint); }
.feedback { display: flex; gap: 4px; margin-top: 6px; }
.feedback button { background: transparent; border: none; font-size: 16px; cursor: pointer; opacity: 0.6; }
.feedback button:hover { opacity: 1; }
</style>
</head>
<body>
<div id="jsErr"></div>

<header>
  <h1><svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect width="8" height="8" fill="#ffffff"/><rect x="1" y="1" width="6" height="5" fill="#cdb4db"/><rect x="2" y="2" width="1" height="1" fill="#3a3a4a"/><rect x="5" y="2" width="1" height="1" fill="#3a3a4a"/><rect x="2" y="4" width="4" height="1" fill="#ffc8dd"/><rect x="3" y="0" width="2" height="1" fill="#3a3a4a"/><rect x="1" y="6" width="6" height="1" fill="#3a3a4a"/></svg>هوش</h1>
  <button class="btn mint" id="convBtn" type="button" title="تاریخچه">☰</button>
  <button class="btn lav px" id="modelBtn" type="button">MODEL</button>
  <button class="btn yellow" id="compareBtn" type="button" title="حالت مقایسه">⚔️</button>
  <button class="btn blue" id="storeBtn" type="button" title="فروشگاه">🛒</button>
  <button class="btn pink" id="dashBtn" type="button" title="هزینه">📊</button>
  <button class="btn yellow" id="exportBtn" type="button" title="خروجی">📤</button>
  <button class="btn blue" id="promptBtn" type="button" title="کتابخانه پرامپت">📚</button>
  <button class="btn lav" id="urlBtn" type="button" title="خواندن سایت">🔗</button>
  <button class="btn red" id="agentBtn" type="button" title="حالت عامل">🤖</button>
  <button class="btn mint" id="themeBtn" type="button" title="حالت شب">🌙</button>
  <button class="btn yellow" id="setBtn" type="button" title="تنظیمات">⚙</button>
</header>

<div id="chat"></div>
<div id="attachPreview" class="attach-preview"></div>

<form id="form">
  <button class="btn mint" id="micBtn" type="button" title="ورودی صوتی">🎤</button>
  <button class="btn blue" id="voiceChatBtn" type="button" title="مکالمه صوتی">🗣️</button>
  <button class="btn mint" id="attachBtn" type="button">📎</button>
  <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.py,.js,.json,.csv,.md" multiple hidden>
  <textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>
  <button class="btn red" id="stopBtn" type="button" style="display:none;">توقف</button>
  <button class="btn pink" id="sendBtn" type="submit">ارسال</button>
</form>

<!-- مودال مدل‌ها -->
<div class="overlay" id="modelOv"><div class="card"><h2>انتخاب مدل</h2><div id="modelList"></div><div class="row" style="margin-top:10px; justify-content:space-between;"><button class="btn mint" id="refreshModelsBtn" type="button">🔄 بروزرسانی</button><button class="btn" id="modelClose" type="button">بستن</button></div></div></div>

<!-- مودال فروشگاه -->
<div class="overlay" id="storeOv">
  <div class="card"><h2>🛒 فروشگاه</h2>
    <div class="store-tabs"><button class="store-tab active" data-tab="tools">ابزارها</button><button class="store-tab" data-tab="skills">مهارت‌ها</button></div>
    <div class="store-grid" id="storeGrid"></div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="storeClose" type="button">بستن</button></div>
  </div>
</div>

<!-- مودال گفتگوها -->
<div class="overlay" id="convOv"><div class="card"><h2>گفتگوها</h2><div id="convList"></div><div class="row" style="margin-top:10px; justify-content:space-between;"><button class="btn mint" id="convNew" type="button">+ جدید</button><button class="btn" id="convClose" type="button">بستن</button></div></div></div>

<!-- مودال پرامپت‌ها -->
<div class="overlay" id="promptOv">
  <div class="card"><h2>📚 کتابخانه پرامپت</h2>
    <div class="row"><input id="newPromptTitle" placeholder="نام" style="flex:1"><input id="newPromptText" placeholder="متن" style="flex:2"></div>
    <button class="btn mint" id="savePromptBtn" type="button">+ افزودن</button>
    <div id="promptList"></div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="promptClose" type="button">بستن</button></div>
  </div>
</div>

<!-- مودال داشبورد -->
<div class="overlay" id="dashOv">
  <div class="card"><h2>📊 داشبورد هزینه</h2>
    <div style="text-align:center;padding:20px;">
      <div class="note">هزینه کل (دلار):</div><div id="totalCostDash" style="font-size:32px;font-weight:bold;direction:ltr;">$0.00000</div>
      <div class="note" style="margin-top:15px;">کل توکن مصرفی:</div><div id="totalTokensDash" style="font-size:24px;direction:ltr;">0</div>
    </div>
    <div class="row" style="margin-top:10px;"><button class="btn" id="dashClose" type="button">بستن</button></div>
  </div>
</div>

<!-- مودال URL -->
<div class="overlay" id="urlOv">
  <div class="card"><h2>🔗 خواندن محتوای وب‌سایت</h2>
    <div class="note">آدرس سایت را وارد کنید تا متن آن خوانده و به مدل داده شود.</div>
    <input id="urlInput" placeholder="https://example.com">
    <div class="row"><button class="btn mint" id="fetchUrlBtn" type="button">خواندن</button><button class="btn" id="urlClose" type="button">بستن</button></div>
  </div>
</div>

<!-- تنظیمات -->
<div class="overlay" id="setOv">
  <div class="card"><h2>تنظیمات</h2>
    <div class="note">کلید API:</div><input id="keyInput" type="password" placeholder="sk-or-v1-...">
    <div class="note">پرامپت سیستم:</div><textarea id="sysPromptInput" rows="2"></textarea>
    <div class="note">خلاقیت (Temp): <span id="tempVal">0.7</span></div><input id="tempInput" type="range" min="0" max="2" step="0.1" value="0.7">
    <div class="row" style="margin-top:10px;"><button class="btn mint" id="keySave" type="button">ذخیره</button><button class="btn pink" id="clearChat" type="button">پاک‌کردن</button><button class="btn" id="setClose" type="button">بستن</button></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
  </html>
